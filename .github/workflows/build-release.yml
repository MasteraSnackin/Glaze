name: Build Release (Publish)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.7.1). Leave empty for auto — v<version> from pubspec.yaml'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Release description (markdown). Leave empty for auto-generated commit log'
        required: false
        type: string
        default: ''
      post_to_telegram:
        description: 'Post build to Telegram'
        required: false
        default: true
        type: boolean
      notify_people:
        description: 'Mention people in Telegram (only if posting is enabled)'
        required: false
        default: false
        type: boolean
      dm_developers:
        description: 'Отправить в ЛС разработчикам (@frostake, @All_Systems_Go)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ── shared metadata ────────────────────────────────────────────────────────
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.meta.outputs.version }}
      tag_name:     ${{ steps.meta.outputs.tag_name }}
      build_date:   ${{ steps.meta.outputs.build_date }}
      build_branch: ${{ steps.meta.outputs.build_branch }}
      build_channel: ${{ steps.meta.outputs.build_channel }}
      file_slug:    ${{ steps.meta.outputs.file_slug }}
      commits:      ${{ steps.meta.outputs.commits }}
      git_sha:      ${{ steps.meta.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compute metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed 's/+.*//' | sed 's/-.*//')
          BUILD_DATE=$(date -u '+%d/%m/%Y %H:%M')
          BUILD_BRANCH="${{ github.ref_name }}"

          SAFE_BRANCH=$(echo "$BUILD_BRANCH" | sed 's#[/ ]#-#g')
          FILE_SLUG="G-$(date -u '+%d%m%Y-%H%M')-$SAFE_BRANCH"

          case "$BUILD_BRANCH" in
            stable)  BUILD_CHANNEL=stable  ;;
            staging) BUILD_CHANNEL=staging ;;
            *)       BUILD_CHANNEL=nightly ;;
          esac

          TAG_NAME="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v${VERSION}"
          fi

          echo "version=$VERSION"           >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME"          >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE"      >> $GITHUB_OUTPUT
          echo "build_branch=$BUILD_BRANCH"  >> $GITHUB_OUTPUT
          echo "build_channel=$BUILD_CHANNEL" >> $GITHUB_OUTPUT
          echo "file_slug=$FILE_SLUG"        >> $GITHUB_OUTPUT
          echo "git_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          git fetch --tags --force
          if git rev-parse refs/tags/build/last >/dev/null 2>&1; then
            COMMIT_LOG=$(git log build/last..HEAD --oneline --no-merges 2>/dev/null || true)
          else
            COMMIT_LOG=$(git log -10 --oneline --no-merges 2>/dev/null || true)
          fi

          COUNT=$(echo "$COMMIT_LOG" | grep -c '[^[:space:]]' || true)

          if [ "$COUNT" -eq 0 ]; then
            COMMITS_TEXT=""
          else
            FORMATTED=$(echo "$COMMIT_LOG" | head -10 \
              | sed 's/^[a-f0-9]\{7,\} //' \
              | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' \
              | sed 's/^/• /')
            if [ "$COUNT" -gt 10 ]; then
              EXTRA=$((COUNT - 10))
              COMMITS_TEXT=$(printf '%s\n+%d коммитов' "$FORMATTED" "$EXTRA")
            else
              COMMITS_TEXT="$FORMATTED"
            fi
          fi

          echo "commits<<DELIM" >> $GITHUB_OUTPUT
          echo "$COMMITS_TEXT"  >> $GITHUB_OUTPUT
          echo "DELIM"          >> $GITHUB_OUTPUT

  # ── android ────────────────────────────────────────────────────────────────
  build-android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create .env from secrets
        run: |
          echo "DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}" >> .env
          echo "DROPBOX_REDIRECT_NATIVE=${{ secrets.DROPBOX_REDIRECT_NATIVE }}" >> .env
          echo "GDRIVE_CLIENT_ID=${{ secrets.GDRIVE_CLIENT_ID }}" >> .env
          echo "GDRIVE_REDIRECT_NATIVE=com.hydall.glaze://oauth/gdrive" >> .env

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (arm64 only)
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: debug-key
          KEY_PASSWORD: android
        run: >
          flutter build apk --release --no-pub --target-platform android-arm64
          "--dart-define=APP_VERSION=${{ needs.metadata.outputs.version }}"
          "--dart-define=BUILD_DATE=${{ needs.metadata.outputs.build_date }}"
          "--dart-define=BUILD_BRANCH=${{ needs.metadata.outputs.build_branch }}"
          "--dart-define=BUILD_COMMIT=${{ needs.metadata.outputs.git_sha }}"
          "--dart-define=BUILD_CHANNEL=${{ needs.metadata.outputs.build_channel }}"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ needs.metadata.outputs.tag_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glaze-release-APK
          path: "build/app/outputs/flutter-apk/${{ needs.metadata.outputs.tag_name }}.apk"

  # ── windows ────────────────────────────────────────────────────────────────
  build-windows:
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create .env from secrets
        shell: bash
        run: |
          echo "DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}" >> .env
          echo "DROPBOX_REDIRECT_NATIVE=${{ secrets.DROPBOX_REDIRECT_NATIVE }}" >> .env
          echo "GDRIVE_CLIENT_ID=${{ secrets.GDRIVE_CLIENT_ID }}" >> .env
          echo "GDRIVE_REDIRECT_NATIVE=com.hydall.glaze://oauth/gdrive" >> .env

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: >
          flutter build windows --release --no-pub
          "--dart-define=APP_VERSION=${{ needs.metadata.outputs.version }}"
          "--dart-define=BUILD_DATE=${{ needs.metadata.outputs.build_date }}"
          "--dart-define=BUILD_BRANCH=${{ needs.metadata.outputs.build_branch }}"
          "--dart-define=BUILD_COMMIT=${{ needs.metadata.outputs.git_sha }}"
          "--dart-define=BUILD_CHANNEL=${{ needs.metadata.outputs.build_channel }}"

      - name: Zip Windows build
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          zip -r "${{ needs.metadata.outputs.tag_name }}-windows.zip" .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glaze-release-Windows
          path: "build/windows/x64/runner/Release/${{ needs.metadata.outputs.tag_name }}-windows.zip"

  # ── ios ────────────────────────────────────────────────────────────────────
  build-ios:
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create .env from secrets
        run: |
          echo "DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}" >> .env
          echo "DROPBOX_REDIRECT_NATIVE=${{ secrets.DROPBOX_REDIRECT_NATIVE }}" >> .env
          echo "GDRIVE_CLIENT_ID=${{ secrets.GDRIVE_CLIENT_ID }}" >> .env
          echo "GDRIVE_REDIRECT_NATIVE=com.hydall.glaze://oauth/gdrive" >> .env

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build iOS (release, no signing)
        run: |
          flutter build ios --release --no-codesign --no-pub \
            "--dart-define=APP_VERSION=${{ needs.metadata.outputs.version }}" \
            "--dart-define=BUILD_DATE=${{ needs.metadata.outputs.build_date }}" \
            "--dart-define=BUILD_BRANCH=${{ needs.metadata.outputs.build_branch }}" \
            "--dart-define=BUILD_COMMIT=${{ needs.metadata.outputs.git_sha }}" \
            "--dart-define=BUILD_CHANNEL=${{ needs.metadata.outputs.build_channel }}"

      - name: Create IPA (manual Payload method)
        run: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos" ]; then
            cp -r build/ios/iphoneos/*.app Payload/ 2>/dev/null || true
          fi
          find build -type d -name "*.app" 2>/dev/null | head -5 | while read app; do
            cp -r "$app" Payload/ 2>/dev/null || true
          done
          zip -r "${{ needs.metadata.outputs.tag_name }}.ipa" Payload || (echo "zip failed, contents:"; find . -name "*.app" 2>/dev/null | head -10)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glaze-release-iOS
          path: "${{ needs.metadata.outputs.tag_name }}.ipa"

  # ── github release ─────────────────────────────────────────────────────────
  release:
    needs: [metadata, build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Glaze-release-APK
          path: release-assets/

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: Glaze-release-Windows
          path: release-assets/

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Glaze-release-iOS
          path: release-assets/

      - name: Prepare release notes
        id: notes
        run: |
          RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$RELEASE_NOTES" ]; then
            COMMITS="${{ needs.metadata.outputs.commits }}"
            if [ -n "$COMMITS" ]; then
              RELEASE_NOTES=$(printf '## Changes\n\n%s' "$COMMITS")
            else
              RELEASE_NOTES="Release ${{ needs.metadata.outputs.tag_name }}"
            fi
          fi
          echo "notes<<DELIM" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES"  >> $GITHUB_OUTPUT
          echo "DELIM"           >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          name: ${{ needs.metadata.outputs.tag_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ needs.metadata.outputs.build_channel != 'stable' }}
          files: release-assets/*
          fail_on_unmatched_files: false

  # ── telegram notify ────────────────────────────────────────────────────────
  notify:
    needs: [metadata, build-android, build-ios, release]
    runs-on: ubuntu-latest
    if: >-
      ${{ success() &&
      (github.event.inputs.post_to_telegram == 'true' ||
       github.event.inputs.dm_developers == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Glaze-release-APK
          path: artifacts/

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Glaze-release-iOS
          path: artifacts/

      - name: Send to Telegram
        if: ${{ github.event.inputs.post_to_telegram == 'true' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          TG_MENTIONS:  ${{ secrets.TG_MENTIONS }}
          NOTIFY_PEOPLE: ${{ github.event.inputs.notify_people || 'true' }}
          VERSION:      ${{ needs.metadata.outputs.version }}
          TAG_NAME:     ${{ needs.metadata.outputs.tag_name }}
          BUILD_DATE:   ${{ needs.metadata.outputs.build_date }}
          BUILD_BRANCH: ${{ needs.metadata.outputs.build_branch }}
          FILE_SLUG:    ${{ needs.metadata.outputs.file_slug }}
          COMMITS:      ${{ needs.metadata.outputs.commits }}
        run: |
          COMMITS_SECTION=""
          if [ -n "$COMMITS" ]; then
            COMMITS_SECTION=$(printf '\n\n%s' "$COMMITS")
          fi

          MENTIONS_SECTION=""
          if [ "$NOTIFY_PEOPLE" = "true" ] && [ -n "$TG_MENTIONS" ]; then
            MENTIONS_SECTION=$(printf '\n\n<tg-spoiler>%s</tg-spoiler>' "$TG_MENTIONS")
          fi

          TEXT=$(printf 'Новый релиз: %s\n\n%s\n%s\n%s%s%s' \
            "$TAG_NAME" "$VERSION" "$BUILD_DATE" "$BUILD_BRANCH" \
            "$COMMITS_SECTION" "$MENTIONS_SECTION")

          MSG_ID=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg cid "$TG_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $cid, text: $text, parse_mode: "HTML"}')" \
            | jq -r '.result.message_id')

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/pinChatMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg cid "$TG_CHAT_ID" --arg mid "$MSG_ID" \
              '{chat_id: $cid, message_id: ($mid | tonumber), disable_notification: true}')"

          for f in artifacts/*; do
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "reply_to_message_id=${MSG_ID}" \
              -F "document=@${f}"
          done

      - name: Send build to developers (DM)
        if: ${{ github.event.inputs.dm_developers == 'true' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_DEV_CHAT_IDS: ${{ secrets.TG_DEV_CHAT_IDS }}
          VERSION:      ${{ needs.metadata.outputs.version }}
          TAG_NAME:     ${{ needs.metadata.outputs.tag_name }}
          BUILD_DATE:   ${{ needs.metadata.outputs.build_date }}
          BUILD_BRANCH: ${{ needs.metadata.outputs.build_branch }}
          FILE_SLUG:    ${{ needs.metadata.outputs.file_slug }}
          COMMITS:      ${{ needs.metadata.outputs.commits }}
        run: |
          if [ -z "$TG_DEV_CHAT_IDS" ]; then
            echo "::warning::TG_DEV_CHAT_IDS secret is empty — skipping developer DMs."
            exit 0
          fi

          COMMITS_SECTION=""
          if [ -n "$COMMITS" ]; then
            COMMITS_SECTION=$(printf '\n\n%s' "$COMMITS")
          fi

          TEXT=$(printf 'Новый релиз (в ЛС): %s\n\n%s\n%s\n%s%s' \
            "$TAG_NAME" "$VERSION" "$BUILD_DATE" "$BUILD_BRANCH" "$COMMITS_SECTION")

          IDS=$(printf '%s' "$TG_DEV_CHAT_IDS" | tr ',' ' ')
          for CID in $IDS; do
            [ -z "$CID" ] && continue

            MSG_ID=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg cid "$CID" --arg text "$TEXT" \
                '{chat_id: $cid, text: $text, parse_mode: "HTML"}')" \
              | jq -r '.result.message_id')

            for f in artifacts/*; do
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${CID}" \
                -F "reply_to_message_id=${MSG_ID}" \
                -F "document=@${f}"
            done
          done

      - name: Advance build/last tag
        if: ${{ github.event.inputs.post_to_telegram == 'true' }}
        run: |
          git tag -f build/last
          git push origin refs/tags/build/last --force
